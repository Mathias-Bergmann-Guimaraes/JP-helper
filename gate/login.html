<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bunpō · Log in</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <!-- Served by server.js at the site's address to everyone without access. It may only use
       files that are open to them: itself and /fonts/. -->
  <style>
    :root {
      --bg: #f6f4ef; --surface: #ffffff; --surface-2: #f0ede6; --text: #1d2025; --muted: #6a6f78;
      --border: #e2ded4; --accent: #c8402f; --good: #1a9a52; --bad: #d63a3a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131519; --surface: #1b1e23; --surface-2: #252930; --text: #e9e7e2; --muted: #9ba1aa;
        --border: #30353d; --accent: #ff7a66; --good: #3ccf7f; --bad: #ff6b6b;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font: 15px/1.55 Inter, "Noto Sans JP", system-ui, sans-serif;
    }
    button, input { font: inherit; color: inherit; }
    .card {
      width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px; box-shadow: var(--shadow); text-align: center;
    }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px; font-weight: 700; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
      background: var(--accent); color: var(--surface); font: 700 1.05rem "Noto Sans JP", sans-serif;
    }
    .brand > span:last-child { text-align: left; }
    .brand small { display: block; font-weight: 500; font-size: .72rem; color: var(--muted); }
    .seal {
      width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
      border: 3px solid var(--accent); color: var(--accent); font: 700 1.6rem "Noto Sans JP", sans-serif;
      transform: rotate(-8deg); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 6px var(--accent);
    }
    .seal.no { border-color: var(--bad); color: var(--bad); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 6px var(--bad); }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .seg { display: inline-flex; gap: 4px; padding: 4px; margin: 8px 0 4px; background: var(--surface-2); border-radius: 999px; }
    .seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .88rem; color: var(--muted); cursor: pointer; }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    @media (max-width: 420px) {
      .card { padding: 26px 18px; }
      .seg button { padding: 6px 9px; font-size: .82rem; }
    }
    form { display: grid; gap: 14px; margin-top: 18px; text-align: left; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
    label small { font-weight: 400; color: var(--muted); }
    input, textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface-2);
      font: inherit; color: inherit;
    }
    textarea { resize: vertical; min-height: 76px; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    input[name="code"] { text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
    .btn {
      padding: 11px; border-radius: 10px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--text); background: var(--text); color: var(--surface);
    }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.quiet { background: none; color: var(--text); border-color: var(--border); padding: 8px 16px; }
    .error { color: var(--bad); font-size: .9rem; min-height: 1.2em; margin: 0; }
    .code { display: inline-block; margin: 2px 0 14px; padding: 6px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 700; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="brand-mark" lang="ja">文</span>
      <span>Bunpō<small>Visual Japanese Grammar</small></span>
    </div>
    <div id="view"></div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    let mode = "login"; // which form to show: "login", "request" or "invite"
    let timer = null;

    const USER_FIELDS = (isNew) => `
      <label>Username ${isNew ? "<small>(3–24 letters, numbers, . _ -)</small>" : ""}
        <input name="username" maxlength="24" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password ${isNew ? "<small>(at least 8 characters)</small>" : ""}
        <input name="password" type="password" maxlength="200"
          ${isNew ? 'minlength="8" autocomplete="new-password"' : 'autocomplete="current-password"'} required></label>`;

    const FORMS = {
      login: { url: "/access/login", button: "Log in", fields: USER_FIELDS(false) },
      request: {
        url: "/access/request",
        button: "Send request",
        fields: USER_FIELDS(true) + `
          <label>Message <small>(optional — who you are, so the owner knows you)</small>
            <textarea name="message" maxlength="300"></textarea></label>`,
      },
      invite: {
        url: "/access/signup",
        button: "Create my login",
        fields: `<label>Invite code
            <input name="code" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false"
              placeholder="XXXXX-XXXXX" required></label>` + USER_FIELDS(true),
      },
    };

    const tab = (m, label) => `<button type="button" data-mode="${m}" class="${mode === m ? "active" : ""}">${label}</button>`;

    const VIEWS = {
      none: () => `
        <div class="seal" lang="ja" aria-hidden="true">鍵</div>
        <h1>This site is private</h1>
        <p class="muted">It's only open to learners the owner lets in. Log in, ask for access, or use the invite code you were given.</p>
        <div class="seg">${tab("login", "Log in")}${tab("request", "Request access")}${tab("invite", "Invite code")}</div>
        <form id="form">
          ${FORMS[mode].fields}
          <p class="error" id="error" role="alert"></p>
          <button class="btn" type="submit">${FORMS[mode].button}</button>
        </form>`,
      pending: () => `
        <div class="seal" lang="ja" aria-hidden="true">待</div>
        <h1>Request sent</h1>
        <p class="muted">Your request code is</p>
        <div class="code" id="code"></div>
        <p class="muted">The owner approves requests by hand. This page opens the site by itself as soon as
          you're let in — on other browsers, just log in with the same username and password.</p>
        <button class="btn quiet" id="logout" type="button">Log out</button>`,
      denied: () => `
        <div class="seal no" lang="ja" aria-hidden="true">否</div>
        <h1>No access</h1>
        <p class="muted">This login doesn't have access to the site.</p>
        <button class="btn quiet" id="logout" type="button">Log out</button>`,
    };

    async function call(url, data) {
      const r = await fetch(url, data
        ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }
        : { cache: "no-store" });
      const json = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(json.error || "Something went wrong. Please try again later.");
      return json;
    }

    function draw(state) {
      if (state.status === "approved") return location.reload();
      const view = VIEWS[state.status] ? state.status : "none";
      $("#view").innerHTML = VIEWS[view]();
      clearInterval(timer);
      if (view === "pending") {
        $("#code").textContent = state.code || "";
        timer = setInterval(async () => draw(await call("/access/status")), 8000);
      }
      if (view !== "none") {
        $("#logout").onclick = async () => draw(await call("/access/logout", {}));
        return;
      }
      document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => {
        mode = b.dataset.mode;
        draw(state);
        $("#form input").focus();
      }));
      $("#form").onsubmit = async (e) => {
        e.preventDefault();
        const button = $("#form button[type=submit]");
        $("#error").textContent = "";
        button.disabled = true;
        try {
          draw(await call(FORMS[mode].url, Object.fromEntries(new FormData(e.target))));
        } catch (err) {
          $("#error").textContent = err.message;
          button.disabled = false;
        }
      };
    }

    call("/access/status").then(draw, () => draw({ status: "none" }));
  </script>
</body>
</html>
