<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Japanese Grammar</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Pick the colour theme before anything is drawn, so the page never flashes the wrong one.
    // app.js keeps it up to date (theme button, device switching between light and dark).
    (function () {
      var t;
      try { t = JSON.parse(localStorage.getItem("jpg.theme")); } catch (e) { /* ignore */ }
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" lang="ja">文</span>
      <span class="brand-text">Bunpō<small>Visual Japanese Grammar</small></span>
    </div>
    <nav class="tabs" id="tabs">
      <div class="tab-group">
        <button data-tab="home"><span class="tab-mark" lang="ja" aria-hidden="true">家</span>Home</button>
        <button data-tab="lessons"><span class="tab-mark" lang="ja" aria-hidden="true">課</span>Lessons</button>
      </div>
      <div class="tab-group">
        <span class="tab-cap">Grammar</span>
        <button data-tab="structure"><span class="tab-mark" lang="ja" aria-hidden="true">文</span>Sentences</button>
        <button data-tab="particles"><span class="tab-mark" lang="ja" aria-hidden="true">は</span>Particles</button>
        <button data-tab="verbs"><span class="tab-mark" lang="ja" aria-hidden="true">動</span>Verbs</button>
        <button data-tab="adjectives"><span class="tab-mark" lang="ja" aria-hidden="true">形</span>Adjectives</button>
        <button data-tab="patterns"><span class="tab-mark" lang="ja" aria-hidden="true">型</span>Patterns</button>
      </div>
      <div class="tab-group">
        <span class="tab-cap">Train</span>
        <button data-tab="practice"><span class="tab-mark" lang="ja" aria-hidden="true">練</span>Practice</button>
        <button data-tab="listen"><span class="tab-mark" lang="ja" aria-hidden="true">聴</span>Listen</button>
        <button data-tab="mistakes"><span class="tab-mark" lang="ja" aria-hidden="true">直</span>Mistakes</button>
      </div>
    </nav>
    <div class="account" id="account"></div>
    <label class="switch">
      <input type="checkbox" id="furiToggle" checked>
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span>Furigana</span>
    </label>
    <button class="account-btn theme-btn" id="themeBtn" type="button"></button>
  </header>

  <main>
    <section id="home" class="panel"></section>
    <section id="lessons" class="panel"></section>
    <section id="structure" class="panel"></section>
    <section id="particles" class="panel"></section>
    <section id="verbs" class="panel"></section>
    <section id="adjectives" class="panel"></section>
    <section id="patterns" class="panel"></section>
    <section id="practice" class="panel"></section>
    <section id="listen" class="panel"></section>
    <section id="mistakes" class="panel"></section>
  </main>

  <footer class="footer">Colours mean the same thing on every page — a green block is always the object, a blue block is always the topic.</footer>

  <!-- The account's lesson progress, from server.js (missing when the page is opened as a file). -->
  <script src="progress.js"></script>
  <script src="js/data.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/verbs.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/drills.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai-reader.js"></script>
  <script src="js/lesson-prompts.js"></script>
  <script src="js/lesson-page.js"></script>
  <script src="js/lesson-write.js"></script>
  <script src="js/lesson-mistakes.js"></script>
  <script src="js/mistakes-page.js"></script>
  <script src="js/lesson-roulette.js"></script>
  <script src="js/lesson-review.js"></script>
  <script src="js/lesson-big.js"></script>
  <script src="js/builds.js"></script>
  <script src="js/lesson-build.js"></script>
  <script src="js/write-prompts.js"></script>
  <script src="js/practice-write.js"></script>
  <script src="js/practice-page.js"></script>
  <script src="js/word-order.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/videos-data.js"></script>
  <script src="js/songs-data.js"></script>
  <script src="js/listen.js"></script>
  <script src="js/home-stats.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
